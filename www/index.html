<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chanel Vs Motoboys</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <header>
            <div class="header-top">
                <h1>Chanel Vs Motoboy</h1>
                <button id="mute-btn" title="Mutar/Desmutar Som"><i class="fas fa-volume-up"></i></button>
            </div>
            <div class="stats">
                <span class="stat-box">Fase: <strong id="phase">1</strong>/3</span>
                <span class="stat-box">Pontos: <strong id="score">0</strong>/100</span>
            </div>
        </header>

        <div id="canvas-container">
            <canvas id="gameCanvas"></canvas>
            
            <!-- Tela de Vitória -->
            <div id="victory-screen" class="hidden">
                <div class="victory-content">
                    <h2>🎉 Parabéns! Você Venceu! 🎉</h2>
                    <p>A Chanel conseguiu vencer todos os motoboys!</p>
                    <div class="video-wrapper">
                        <!-- Adicionado autoplay, loop, playsinline, webkit-playsinline e controle para garantir que rode -->
                        <video id="victory-video" src="chanel.mp4" playsinline webkit-playsinline loop muted autoplay></video>
                    </div>
                    <button id="restart-btn"><i class="fas fa-redo"></i> Jogar Novamente</button>
                </div>
            </div>
        </div>

        <div id="mobile-controls">
            <button id="left-btn" title="Ir para Esquerda"><i class="fas fa-paw"></i></button>
            <button id="right-btn" title="Ir para Direita"><i class="fas fa-paw"></i></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
